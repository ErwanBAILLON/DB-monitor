# db-monitor - Helm Values

replicaCount: 1

image:
  repository: git.ebaillon.fr/infra/db-monitor
  tag: "0.1.11"
  pullPolicy: Always

imagePullSecrets:
  - name: gitea-registry-credentials

nameOverride: ""
fullnameOverride: "db-monitor"

serviceAccount:
  create: true
  name: "db-monitor"

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

# LAN only: the host's A record points to the node IP and is not in the Cloudflare tunnel.
ingress:
  enabled: true
  host: dbmon.ebaillon.fr
  tls: true
  certResolver: letsencrypt
  # Shared Traefik middlewares (orgs/infra/traefik, cross-namespace) + a chart-local
  # per-client-IP rate limit (ratelimit-public keys on CF-Connecting-IP, which this
  # LAN-only host never carries) and a stricter one on the credentials callback.
  hardening:
    enabled: true
    rateLimit:
      average: 50
      burst: 100
    loginRateLimit:
      average: 1   # requests per second per client IP on /api/auth/callback/credentials
      burst: 5

resources:
  limits:
    cpu: 400m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 192Mi

nodeSelector: {}
tolerations: []
affinity: {}

# SQLite files are read from volumes mounted read-only into the pod. Each mount
# becomes an allowed root (DBMON_SQLITE_ROOTS); the instance's "database" field is
# the file path. `sample: true` adds an emptyDir at /data/sqlite with a demo file
# written on pod start (scripts/sqlite-sample.cjs) so the engine has a live testbed.
sqlite:
  sample: true
  samplePath: /data/sqlite/sample.db
  mounts: []
  #  - name: app-sqlite
  #    mountPath: /data/sqlite/app
  #    persistentVolumeClaim: app-data   # or hostPath: /srv/app/data

env:
  NODE_ENV: production
  NEXTAUTH_URL: https://dbmon.ebaillon.fr

# Secrets synchronised from Vault via ExternalSecrets Operator
# (helm/templates/external-secret.yaml). Nothing sensitive here.
# Required keys: DATABASE_URL, AUTH_SECRET, DBMON_ENCRYPTION_KEY, ADMIN_USERNAME, ADMIN_PASSWORD.
# Optional: DBMON_SEED_JSON, SMTP_HOST/PORT/USER/PASSWORD, EMAIL_FROM, ALERT_EMAIL.
vault:
  secretPath: secret/data/db-monitor/main

livenessProbe:
  httpGet:
    path: /api/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 5

startupProbe:
  httpGet:
    path: /api/live
    port: http
  initialDelaySeconds: 10
  failureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 10

# One pod: the in-process checker must not run twice.
strategy:
  type: Recreate

# NOTE: the cluster CNI is flannel, which does NOT enforce NetworkPolicy. The policy
# below is kept as declared intent (it becomes effective if the CNI changes); the
# effective control is the application allowlist DBMON_ALLOWED_TARGETS, rendered from
# this same list (helpers: db-monitor.allowedTargets) and checked on every instance
# create / edit / test.
networkPolicy:
  enabled: true
  # Databases the console may reach: namespace -> ports.
  egress:
    - namespace: database
      ports: [5432]
    - namespace: projects
      # postgres, redis, mysql/mariadb, mongodb, clickhouse http, opensearch http, sql server, cockroach, cassandra/scylla cql, influxdb http, neo4j bolt, etcd client
      ports: [5432, 6379, 3306, 27017, 8123, 9200, 1433, 26257, 9042, 8086, 7687, 2379]
    - namespace: argocd
      ports: [6379]
    - namespace: monitoring
      ports: [6379]
    - namespace: falco
      ports: [6379]
    - namespace: git
      ports: [5432, 6379]
  # Extra app-level targets outside the cluster DNS pattern, e.g. "db.lan:5432".
  extraTargets: []
