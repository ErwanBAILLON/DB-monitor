apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "db-monitor.fullname" . }}-secrets
  labels:
    {{- include "db-monitor.labels" . | nindent 4 }}
  annotations:
    # Plain resource (not a hook): a hook ExternalSecret was garbage-collected
    # by ArgoCD and took the Secret (creationPolicy Owner) with it. Wave -3 so
    # it is Healthy before the Deployment, whose init container migrates.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "db-monitor.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  # Required keys: DATABASE_URL, AUTH_SECRET, SESSION_SECRET, RETENTION_KEY, ADMIN_USERNAME, ADMIN_PASSWORD.
  # Optional: SMTP_HOST/PORT/USER/PASSWORD, EMAIL_FROM, NOTIFY_EMAIL,
  # LEGAL_NAME/STATUS/SIRET/ADDRESS/EMAIL/VAT_MENTION.
  dataFrom:
    - extract:
        key: {{ .Values.vault.secretPath }}
        # ESO defaults, spelled out so ArgoCD does not report a permanent diff.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
